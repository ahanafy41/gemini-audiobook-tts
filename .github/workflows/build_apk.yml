name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Fixed Debug Keystore for Consistent Signatures
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.0.3"
          name: "Gemini Audiobook TTS v1.0.3 (APK)"
          body: |
            ### 📱 تطبيق Gemini Audiobook TTS - تحديث v1.0.3 (ذكاء اصطناعي كامل)
            
            - الاعتماد الحصري الكامل 100% على الذكاء الاصطناعي التوليدي عبر Google Gemini Flash TTS.
            - دعم النموذج الجديد الرسمي `gemini-3.8-flash-tts` و `gemini-2.0-flash`.
            - إلغاء الأصوات المحلية تماماً لضمان أعلى جودة صوتية بشرية نقية وطبيعية.
            - واجهة إعدادات مخصصة وسهلة مع دعم أصوات Gemini الرسمية (Kore, Puck, Charon, Fenrir, Aoede).
            - زر فحص واستماع مباشر للصوت في السماعة للتأكد قبل تحويل الكتب.
            - توافق فائق وسلس مع قارئات الشاشة TalkBack و Jieshuo.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
