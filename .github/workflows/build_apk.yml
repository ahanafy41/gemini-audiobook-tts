name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Permanent Keystore
        run: |
          if [ -f "android/keystore/permanent.keystore" ]; then
            echo "Permanent Keystore verified: android/keystore/permanent.keystore"
          else
            echo "Error: android/keystore/permanent.keystore missing!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.2.0"
          name: "Gemini Audiobook TTS v1.2.0 (APK)"
          body: |
            ### 📱 تطبيق Gemini Audiobook TTS - التحديث v1.2.0

            - **تطوير محرك الحوار متعدد المتحدثين (Official Google Multi-Speaker Engine)**:
              - دعم كامل لصيغة Google AI Studio القياسية للبودكاست والسيناريو (`Speaker1:` و `Speaker2:` أو كتابة أسماء المتحدثين في بداية السطور).
              - دعم صيغة الروايات الكلاسيكية عبر علامات التنصيص (`«...»` أو `"..."`).
              - كاشف وتحليل فوري لنوع النص في شاشة "لصق نص" يوضح عدد مقاطع الراوي والشخصيات لحظياً لقارئات الشاشة.
              - زر "نموذج حوار" في شاشة لصق النص لإدراج قالب حوار ثنائي رسمي معتمد بضغطة زر وتفعيل الحوار تلقائياً.
              - زر "دليل صيغة الحوار" في تبويب الأصوات لشرح الصيغة ونسخ نموذج تجريبي جاهز.
            - **التوقيع الدائم الموحد والتحديث التلقائي**:
              - الحزمة موقعة بالمفتاح الدائم الموحد لضمان التحديث المباشر السلس.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
