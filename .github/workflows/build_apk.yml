name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Permanent Keystore
        run: |
          if [ -f "android/keystore/permanent.keystore" ]; then
            echo "Permanent Keystore verified: android/keystore/permanent.keystore"
          else
            echo "Error: android/keystore/permanent.keystore missing!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.1.4"
          name: "Gemini Audiobook TTS v1.1.4 (APK)"
          body: |
            ### 📱 تطبيق Gemini Audiobook TTS - التحديث v1.1.4

            - **حل مشكلة تعارض حزم التثبيت للأبد (Permanent Keystore Signing)**:
              - اعتماد مفتاح توقيع رقمي دائم وموحد (`permanent.keystore`) لجميع الإصدارات، مما يضمن تثبيت كافة التحديثات المستقبلية مباشرة بضغطة واحدة فوق أي إصدار سابق دون الحاجة لمسح التطبيق إطلاقاً.
            - **تصدير وسحب الملفات الصوتية إلى التنزيلات (Export to Downloads)**:
              - إمكانية سحب وتصدير كل فصول الكتاب الصوتية بنقرة واحدة إلى مجلد الهاتف العام (`Download/Audiobooks/<اسم الكتاب>/`) للوصول إليها من أي مدير ملفات أو مشغل صوتي خارجي.
              - التصدير التلقائي في الخلفية لكل فصل صوتي يتم تحويله مباشرة إلى مجلد التنزيلات.
              - زر مشاركة فورية (Share Audio) لإرسال فصول الكتاب إلى واتساب، تليجرام، أو Google Drive.
            - **معالجة انقطاع الشبكة والـ DNS (Resilient DNS & Network Retry)**:
              - إضافة نظام `ResilientDns` وإعادة المحاولة الذكية (5 محاولات) عند أي تأرجح بالشبكة.
            - **الاستئناف الفوري بضغطة واحدة (1-Tap Instant Resume)**:
              - إكمال الفصول المتبقية بنقرة واحدة دون الحاجة لإعادة اختيار ملف النص.
            - **استوديو الأصوات المتقدم (Gemini 3.8 Flash TTS)**:
              - كتالوج الـ 30 صوتاً رسمياً، 4 أنماط إلقاء، الحوار متعدد الرواة، وتصميم الأصوات بالذكاء الاصطناعي.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
