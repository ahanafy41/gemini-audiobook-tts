name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Permanent Keystore
        run: |
          if [ -f "android/keystore/permanent.keystore" ]; then
            echo "Permanent Keystore verified: android/keystore/permanent.keystore"
          else
            echo "Error: android/keystore/permanent.keystore missing!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.4.1"
          name: "Gemini Audiobook TTS v1.4.1 (APK)"
          body: |
            ### 📱 تطبيق Gemini Audiobook TTS - التحديث v1.4.1

            - **إصلاح خطأ استخراج الصوت (Fix Audio data not found in response JSON)**:
              - **فحص شامل لجميع الأجزاء (Multi-Part Scanning)**: فحص كافة المرشحات (`candidates`) وجميع الأجزاء (`parts`) لاستخراج الصوت من أي جزء يتضمن بيانات صوتية بدلاً من الاقتصار على الجزء الأول فقط.
              - **تعطيل فلاتر الأمان الزائدة (BLOCK_NONE Safety Settings)**: تفعيل إعدادات الأمان بدون حظر لمنع خادم جوجل من حظر الروايات والنصوص الأدبية الكلاسيكية بسبب المشاهد الدرامية أو ألفاظ الصراع والمرض.
              - **تقليص حجم المقطع الصوتي (Safe Chunk Size: 2000 Chars)**: ضبط حجم مقاطع النصوص على 2000 حرف كحد أقصى لتجنب تجاوز ميزانية الـ Tokens لتوليد الصوت (MAX_TOKENS) وضمان توليد سريع ومستقر لكل مقطع.
              - **تعليمات النظام الصارمة للراوي (System Instructions)**: توجيه النموذج كراوٍ صوتي محترف لقراءة النص حرفياً ومنعه تماماً من الرد بنصوص محادثة أو تفسيرات.
              - **تشخيص أخطاء الاستجابة بدقة**: إظهار سبب التوقف الحقيقي (الأمان، حقوق النشر، طول النص) بدقة في رسائل الخطأ بدلاً من الرسائل المبهمة.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
