name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Permanent Keystore
        run: |
          if [ -f "android/keystore/permanent.keystore" ]; then
            echo "Permanent Keystore verified: android/keystore/permanent.keystore"
          else
            echo "Error: android/keystore/permanent.keystore missing!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.4.4"
          name: "Gemini Audiobook TTS v1.4.4 (APK)"
          body: |
            ### 📱 تطبيق Gemini Audiobook TTS - التحديث v1.4.4

            - **إصلاح خطأ 400 (Developer instruction is not enabled for this model)**:
              - إزالة تعليمات المطور (Developer instruction) غير المدعومة في نموذج التوليد الصوتي لـ Gemini TTS ليعمل التوليد بسلاسة وبدون أي أخطاء.
            - **ضبط حدود النصوص إلى 8000 حرف (8000 Characters Safe Chunking)**:
              - ضبط سقف تقطيع الفصول إلى 8000 حرف بدقة وفق رغبة المستخدم لضمان استقرار التحويل.
            - **إصلاح خطأ 403 في فحص التحديثات (Fix 403 Update Check Error)**:
              - إضافة نظام استرجاع مباشر (Web Fallback) لتجاوز قيود GitHub API والتحقق من التحديثات بنجاح دائم.
            - **فحص شامل لكافة أجزاء الاستجابة (Multi-Part Scanning)**:
              - استخراج الصوت بدقة حتى لو تم إرجاعه عبر أجزاء متعددة في الرد.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
