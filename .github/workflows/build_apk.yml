name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Fixed Debug Keystore for Consistent Signatures
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.0.2"
          name: "Gemini Audiobook TTS v1.0.2 (APK)"
          body: |
            ### 📱 تطبيق Gemini Audiobook TTS - تحديث v1.0.2
            
            - إصلاح نقر عناصر قائمة الكتب للتشغيل المباشر عبر TalkBack و Jieshuo.
            - زر التشغيل الرئيسي يبدأ تشغيل أول كتاب في القائمة تلقائياً إذا لم يكن هناك كتاب محدد.
            - توحيد مفتاح التوقيع الرقمي لتثبيت التحديثات المستقبلية بسلاسة بدون تعارض.
            - محرك أندرويد الصوتي المدمج (أوفلاين بدون إنترنت وبأصوات عربية كاملة).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
