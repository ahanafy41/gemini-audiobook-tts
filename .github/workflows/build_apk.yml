name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Permanent Keystore
        run: |
          if [ -f "android/keystore/permanent.keystore" ]; then
            echo "Permanent Keystore verified: android/keystore/permanent.keystore"
          else
            echo "Error: android/keystore/permanent.keystore missing!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          set -o pipefail
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle_build.log || {
            echo "=== GRADLE BUILD FAILED ==="
            PASTE_URL=$(curl -s -F 'content=<-' https://dpaste.org/api/ < /tmp/gradle_build.log || echo "failed to paste")
            echo "Gradle Error Log URL: $PASTE_URL"
            mkdir -p app/build/reports/
            echo "$PASTE_URL" > app/build/reports/paste_url.txt
            tail -n 100 /tmp/gradle_build.log
            exit 1
          }

      - name: Capture Gradle Build Failure
        if: failure()
        working-directory: android
        run: |
          echo "=== GRADLE FAILURE DIAGNOSTICS ==="
          find . -name "*.txt" -o -name "*.log" | grep -E "build|report" | head -n 30
          find app/build/reports -type f -exec head -n 50 {} + 2>/dev/null || true

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
          retention-days: 2

      - name: Locate and Stage Built APK
        run: |
          mkdir -p release-apk
          find android -name "*.apk" -exec cp -v {} release-apk/ \;
          ls -la release-apk/

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: release-apk/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="v1.5.3"
          echo "Uploading APK to GitHub Release ${APP_VERSION}..."
          gh release upload ${APP_VERSION} release-apk/*.apk --clobber || {
            echo "Release ${APP_VERSION} upload failed, attempting create or fallback upload..."
            gh release create ${APP_VERSION} release-apk/*.apk \
              --title "Gemini Audiobook TTS ${APP_VERSION} (Android & Desktop Suite)" \
              --notes-file docs/RELEASE_NOTES_v1.5.3.md || \
            gh release upload ${APP_VERSION} release-apk/*.apk
          }
