name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Permanent Keystore
        run: |
          if [ -f "android/keystore/permanent.keystore" ]; then
            echo "Permanent Keystore verified: android/keystore/permanent.keystore"
          else
            echo "Error: android/keystore/permanent.keystore missing!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.1.8"
          name: "Gemini Audiobook TTS v1.1.8 (APK)"
          body: |
            ### 📱 تطبيق Gemini Audiobook TTS - التحديث v1.1.8

            - **تقييد اختيار الملفات (Strict Text & Markdown Picker)**:
              - حصر اختيار الملفات على ملفات النصوص (`.txt`) والمارك داون (`.md`) فقط ومنع ملفات Word و PDF.
              - إضافة فحص برمجي صارم للامتداد لضمان سلامة الملفات المدخلة.
            - **إيجاز وتبسيط نصوص الواجهة (Concise UI & Screen Reader Friendly)**:
              - اختصار جميع العناوين والتسميات في المشغل والاستوديو والإعدادات لتكون موجزة وواضحة مباشرة.
              - إزالة أي زوائد أو أقواس إنجليزية غير ضرورية.
              - إزالة بطاقة إمكانية الوصول التوضيحية بالكامل لتفادي التشويش الصوتي لقارئات الشاشة.
              - تبسيط وتنسيق عناوين الشاشات والأزرار لتكون مباشرة ومريحة.
            - **التوقيع الدائم الموحد والتحديث التلقائي**:
              - توقيع الحزمة بالمفتاح الدائم لضمان التثبيت المباشر فوق الإصدارات السابقة.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
