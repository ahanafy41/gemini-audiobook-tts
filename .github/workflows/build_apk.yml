name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Permanent Keystore
        run: |
          if [ -f "android/keystore/permanent.keystore" ]; then
            echo "Permanent Keystore verified: android/keystore/permanent.keystore"
          else
            echo "Error: android/keystore/permanent.keystore missing!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.4.0"
          name: "Gemini Audiobook TTS v1.4.0 (APK)"
          body: |
            ### 📱 تطبيق Gemini Audiobook TTS - التحديث v1.4.0

            - **تحكم كامل للمستخدم وإلغاء المحاولات الصامتة (Zero Silent Retries & Manual Control)**:
              - إزالة حلقة التكرار التلقائية السريعة عند حدوث خطأ تجاوز الحصة (HTTP 429) لمنع استنزاف حدود الاستخدام اليومي أو الدقيقة خلف ظهر المستخدم.
              - إيقاف التحويل فوراً وإظهار نافذة تفاعلية سهلة الوصول تتيح للمستخدم: «إعادة المحاولة الآن» أو «تعديل مفتاح API» أو الاستئناف لاحقاً.

            - **محرك الاستئناف الذكي وتخزين الحالة (Smart Resume Engine & Persistent State)**:
              - حفظ إعدادات كل كتاب (`book_settings.json`) وحالة الفصول المنجزة تلقائياً.
              - عند استئناف أي كتاب غير مكتمل، يتخطى التطبيق جميع المقاطع والفصول المنجزة (> 1000 بايت) ويكمل مباشرة من أول مقطع متبقٍ دون إعادة توليد المقاطع المكتملة.

            - **بطاقة استئناف تفاعلية في المكتبة وقارئات الشاشة (Library Resume Card & Accessible Dialogs)**:
              - إظهار بطاقة بارزة أعلى تبويب المكتبة عند وجود أي كتاب غير مكتمل مع تفاصيل الفصول المنجزة وزر «استئناف التحويل» فوري.
              - عند النقر على أي كتاب غير مكتمل في القائمة، تظهر نافذة واضحة تتيح الاختيار بين «استئناف التحويل» أو «تشغيل الفصول المنجزة».

            - **حماية المعالجة في الخلفية وإطفاء الشاشة (Background WakeLock Protection)**:
              - تفعيل `PARTIAL_WAKE_LOCK` أثناء التحويل لضمان استمرار المعالجة والاتصال بالشبكة حتى لو أطفأ المستخدم الشاشة لتوفير الطاقة.

            - **تسريع وتيرة التحويل بين المقاطع (5s Pacing Delay)**:
              - تحسين زمن الانتظار الصحي بين المقاطع ليصبح 5 ثوانٍ فقط بدلاً من 60 ثانية، مع الحفاظ الكامل على استقرار الحصة وسرعة التوليد.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
