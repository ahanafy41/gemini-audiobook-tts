name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Permanent Keystore
        run: |
          if [ -f "android/keystore/permanent.keystore" ]; then
            echo "Permanent Keystore verified: android/keystore/permanent.keystore"
          else
            echo "Error: android/keystore/permanent.keystore missing!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.1.5"
          name: "Gemini Audiobook TTS v1.1.5 (APK)"
          body: |
            ### 📱 تطبيق Gemini Audiobook TTS - التحديث v1.1.5

            - **إصلاح ميزة تصميم الأصوات (Voice Design Fix)**:
              - معالجة استخراج معرف الصوت (`voiceId`) والمقطع الصوتي التجريبي وحفظ الصوت فورياً في استوديو وقوائم الأصوات مع تفعيله التلقائي.
            - **التحديث التلقائي من داخل التطبيق (In-App OTA Updates)**:
              - إمكانية فحص التحديثات وتحميل أحدث إصدار وتثبيته مباشرة من داخل التطبيق بنقرة واحدة عبر إذن `REQUEST_INSTALL_PACKAGES`.
            - **توقيع دائم وموحد (Permanent Keystore Signing)**:
              - تثبيت التحديثات المستقبلية مباشرة فوق النسخة الحالية دون أي تعارض في حزم التثبيت.
            - **أذونات الوصول وتصدير الملفات (File Permissions & Export)**:
              - دعم كامل لحفظ وتصدير الفصول الصوتية ومشاركتها مع مشغلات الصوت والتطبيقات الأخرى.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
