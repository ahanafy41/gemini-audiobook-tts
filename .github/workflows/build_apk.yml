name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Permanent Keystore
        run: |
          if [ -f "android/keystore/permanent.keystore" ]; then
            echo "Permanent Keystore verified: android/keystore/permanent.keystore"
          else
            echo "Error: android/keystore/permanent.keystore missing!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.5.0"
          name: "Gemini Audiobook TTS v1.5.0 (Android & Desktop Suite)"
          body: |
            ### 🚀 تطبيق Gemini Audiobook TTS - التحديث الشامل v1.5.0 (الموبايل وسطح المكتب)

            - **جناح ديسكتوب متكامل للكمبيوتر (Desktop App Suite)**:
              - تطبيق كامل بنظام Hub مبني بـ wxPython متوافق 100% مع قارئ الشاشة NVDA ومستخدمي الكمبيوتر.
              - تشفير محلي للمفاتيح عبر Windows DPAPI لحمايتها من التسريب.
              - ملف تشغيل مباشر `run_desktop.bat` وإدارة كاملة للأصوات والكتب.

            - **إدارة حصص المفاتيح الدائمة وتدوير الـ 429 (Persistent Key Quota Manager)**:
              - دعم قائمة مفاتيح غير محدودة مع تدوير فوري وتلقائي عند أخطاء 429.
              - استخراج `retryDelay` وحساب موعد تصفير كوتا جوجل الرسمي (منتصف الليل بتوقيت المحيط الهادئ Pacific Midnight).
              - استئناف المفاتيح المستنفدة تلقائياً فور انتهاء موعد الحظر.

            - **محرك الحوار المتقدم وأفعال القول (Inquit & Emotion Engine)**:
              - فصل أفعال القول (Inquit verbs) تلقائياً بين الراوي والشخصيات بست لغات.
              - استنتاج المشاعر من سياق السرد العربي (همس، غضب، بكاء، هدوء...) وتوجيه نبرة الصوت آلياً.

            - **نطق عناوين الفصول ودعم ملفات Word (.docx)**:
              - نطق عنوان الفصل صوتياً مع وقفة قصيرة قبل بدء قراءة الفصل.
              - دعم استيراد ملفات Microsoft Word (.docx) مباشرة وبدون أي مكاتب خارجية.
              - توسيع أنماط التقاط الفصول بالأرقام والمصطلحات التراثية.

            - **تصدير ملفات الفهرسة وقوائم التشغيل (CUE Sheet & M3U)**:
              - توليد ملفات `book.cue` و `playlist.m3u` تلقائياً لتشغيل الفصول المقسمة على مشغلات الصوت الاحترافية.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
