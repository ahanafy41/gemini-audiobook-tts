name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Fixed Debug Keystore for Consistent Signatures
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.1.0"
          name: "Gemini Audiobook TTS v1.1.0 (APK)"
          body: |
            ### 📱 تطبيق Gemini Audiobook TTS - التحديث الشامل v1.1.0
            
            - **واجهة عصرية بتصميم Material Design**: تبويبات سفلية متوافقة بالكامل مع قارئات الشاشة (TalkBack وقارئ الشاشة الصيني Jieshuo / CSR).
            - **استوديو الأصوات المتقدم (Gemini 3.8 Flash TTS)**:
              - دعم كامل لقائمة الـ 30 صوتاً رسمياً مع التوصيف الصوتي والنبرات.
              - 4 أنماط إلقاء مخصصة (الوثائقي الرصين، الدرامي المشوق، الهادئ المريح، والطبيعي).
              - ميزة **الحوار متعدد الرواة (Multi-Speaker Dialogue)** للقصص والروايات.
              - ميزة **تصميم الأصوات من الصفر (Voice Design)** وتوليد أصوات مخصصة بالوصف النصي ومعاينتها مباشرة.
            - **مشغل صوتي مخصص**: إمكانية التنقل بين الفصول، تقديم 30 ثانية وتأخير 15 ثانية والتحكم بالسرعة.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
