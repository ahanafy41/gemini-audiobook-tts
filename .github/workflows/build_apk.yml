name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Permanent Keystore
        run: |
          if [ -f "android/keystore/permanent.keystore" ]; then
            echo "Permanent Keystore verified: android/keystore/permanent.keystore"
          else
            echo "Error: android/keystore/permanent.keystore missing!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.3.2"
          name: "Gemini Audiobook TTS v1.3.2 (APK)"
          body: |
            ### 📱 تطبيق Gemini Audiobook TTS - التحديث v1.3.2

            - **إزالة التشويش والوشّة الصوتية في نهايات الفصول (WAV Metadata Demuxing & Clean PCM)**:
              - تطبيق خوارزمية فحص الـ RIFF واستخراج كتلة الصوت الحقيقية (`data` subchunk) فقط بدقة بالغة.
              - استبعاد كتل البيانات الوصفية (C2PA / SynthID / LIST metadata) التي كانت تُعامل كعينات صوت وتسبب الوشّة العالية.
              - تطبيق تلاشٍ تدريجي ناعم (50ms Fade-out) لمنع أي طقطقة رقمية (DC offset click) بين المقاطع وفي نهاية الصوت.

            - **تنقية بدايات الفصول من العناوين والوسوم غير المرغوبة (Clean Narrative Audio)**:
              - إزالة حقن العناوين التلقائية وبادئة `<short pause>` من النص المرسل إلى Gemini TTS.
              - منع نطق "الكتاب كاملاً." أو عناوين الأجزاء قبل بداية الرواية، لتبدأ القراءة مباشرة من النص الحقيقي.
              - تمرير تعليمات الصوت ونمط الأداء عبر `speechMetadata` بدلاً من دمجها في النص المسموع لمنع قراءة وسوم التوجيه.

            - **الوصول المباشر الكامل لجذر الذاكرة الداخلية (Full Storage Access / Direct Root Folder)**:
              - إضافة إذن `MANAGE_EXTERNAL_STORAGE` لحفظ وتصدير الكتب الصوتية وفصولها مباشرة في جذر الذاكرة الداخلية في المجلد المعتمد: `/sdcard/GeminiAudiobook/<اسم_الكتاب>/` بدلاً من دفنها في المجلدات الفرعية.
            - **إشعار فوري للنظام (MediaScanner Integration)**:
              - فحص وتحديث فهرس وسائط أندرويد تلقائياً عبر `MediaScannerConnection` فور حفظ أي ملف صوتي ليظهر فوراً في قارئات الشاشة (TalkBack / Jieshuo) وتطبيقات الصوتيات.
            - **بطاقة فحص وتفعيل إذن الملفات في الإعدادات (Storage Permission Card)**:
              - إضافة خيار وبطاقة تفاعلية في تبويب الإعدادات توضح مسار الحفظ المعتمد وتتيح فحص ومنح إذن الوصول لجميع الملفات بضغطة زر واحدة.
            - **توحيد الملف الكامل لجميع الكتب (Full Unified Audio for All Books)**:
              - ضمان إنشاء وتصدير الملف الصوتي الموحد الكامل (`_كامل.wav`) لجميع الكتب سواء كانت فصلاً واحداً أو عدة فصول.

            - **فاصل زمني وقائي (60-Second Delay)**:
              - إضافة فاصل دقيقة كاملة (60 ثانية) بين تحويل فصول الكتاب لتجنب استنزاف حد الحصة (Quota / 429) لحسابات Gemini المجانية.
            - **تحديد اسم الكتاب بدقة (Book Title Handling)**:
              - معالجة اسم الكتاب بشكل مستقل عن الفصل الأول، مع تعيين اسم افتراضي «بدون اسم» إذا لم يُحدد عنوان وتجنب الأسماء المؤقتة.
            - **الدمج التلقائي لفصول الكتاب (Auto-Merge Audiobook)**:
              - دمج جميع فصول الكتاب تلقائياً عند اكتمال التحويل في ملف صوتي موحد كامل (`_كامل.wav`).
            - **مجلد حفظ مخصص بالذاكرة الداخلية (Dedicated Folder)**:
              - حفظ وتصدير الكتب الصوتية تلقائياً في مجلد مخصص باسم `GeminiAudiobook` بالذاكرة الداخلية بدلاً من مجلد التنزيلات العام.
            - **نافذة تقدم التحديث التلقائي (Live Update Progress Dialog)**:
              - استبدال التحديث الصامت بنافذة تفاعلية مرئية وصوتية بشريط تمرير أفقي ومتابعة نسبة التحميل مع إعلانات صوتية لقارئات الشاشة (TalkBack / Jieshuo).
            - **التعليمات المخصصة للصوت (Custom Voice Instructions)**:
              - إضافة خيار توجيهات الأداء الصوتي المخصصة في استوديو الأصوات لحقن توجيهات النبرة والأداء داخل نماذج Gemini TTS.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
