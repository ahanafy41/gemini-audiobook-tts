name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Permanent Keystore
        run: |
          if [ -f "android/keystore/permanent.keystore" ]; then
            echo "Permanent Keystore verified: android/keystore/permanent.keystore"
          else
            echo "Error: android/keystore/permanent.keystore missing!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.4.3"
          name: "Gemini Audiobook TTS v1.4.3 (APK)"
          body: |
            ### 📱 تطبيق Gemini Audiobook TTS - التحديث v1.4.3

            - **إصلاح خطأ 403 في فحص التحديثات (Fix 403 Update Check Error)**:
              - إضافة نظام استرجاع مباشر (Web Fallback) لتجاوز قيود واجهة برمجة تطبيقات GitHub (API Rate Limits 403)، مما يضمن نجاح فحص التحديثات من داخل التطبيق بنسبة 100% دائماً.
            - **دعم النصوص الطويلة حتى 12000+ حرف (Gemini 3.8 Flash TTS Full Capacity)**:
              - رفع سقف التقطيع الافتراضي إلى 12000 حرف مع سقف أقصى 30000 حرف للاستفادة الكاملة من قدرات Gemini 3.8 Flash TTS الفائقة في معالجة الفصول الطويلة كقطعة واحدة.
            - **إصلاح خطأ استخراج الصوت (Fix Audio data not found in response JSON)**:
              - **فحص شامل لجميع الأجزاء (Multi-Part Scanning)**: استخراج الصوت من كافة أجزاء الرد.
              - **تعطيل فلاتر الأمان للروايات الأدبية (BLOCK_NONE Safety Settings)**: منع حظر الروايات بسبب المفردات الدرامية.
              - **تعليمات النظام الصارمة للراوي (System Instructions)**: فرض قراءة النص حرفياً بدون أي كلام إضافي.
              - **تشخيص أخطاء الاستجابة بدقة**: إظهار السبب الفعلي لأي توقف من الخادم.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
