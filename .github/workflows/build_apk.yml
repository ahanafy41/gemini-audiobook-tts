name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Permanent Keystore
        run: |
          if [ -f "android/keystore/permanent.keystore" ]; then
            echo "Permanent Keystore verified: android/keystore/permanent.keystore"
          else
            echo "Error: android/keystore/permanent.keystore missing!"
            exit 1
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAudiobook-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Automatic Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: "v1.3.0"
          name: "Gemini Audiobook TTS v1.3.0 (APK)"
          body: |
            ### 📱 تطبيق Gemini Audiobook TTS - التحديث v1.3.0

            - **فاصل زمني وقائي (60-Second Delay)**:
              - إضافة فاصل دقيقة كاملة (60 ثانية) بين تحويل فصول الكتاب لتجنب استنزاف حد الحصة (Quota / 429) لحسابات Gemini المجانية.
            - **تحديد اسم الكتاب بدقة (Book Title Handling)**:
              - معالجة اسم الكتاب بشكل مستقل عن الفصل الأول، مع تعيين اسم افتراضي «بدون اسم» إذا لم يُحدد عنوان وتجنب الأسماء المؤقتة.
            - **الدمج التلقائي لفصول الكتاب (Auto-Merge Audiobook)**:
              - دمج جميع فصول الكتاب تلقائياً عند اكتمال التحويل في ملف صوتي موحد كامل (`_كامل.wav`).
            - **مجلد حفظ مخصص بالذاكرة الداخلية (Dedicated Folder)**:
              - حفظ وتصدير الكتب الصوتية تلقائياً في مجلد مخصص باسم `GeminiAudiobook` بالذاكرة الداخلية بدلاً من مجلد التنزيلات العام.
            - **نافذة تقدم التحديث التلقائي (Live Update Progress Dialog)**:
              - استبدال التحديث الصامت بنافذة تفاعلية مرئية وصوتية بشريط تمرير أفقي ومتابعة نسبة التحميل مع إعلانات صوتية لقارئات الشاشة (TalkBack / Jieshuo).
            - **التعليمات المخصصة للصوت (Custom Voice Instructions)**:
              - إضافة خيار توجيهات الأداء الصوتي المخصصة في استوديو الأصوات لحقن توجيهات النبرة والأداء داخل نماذج Gemini TTS.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
